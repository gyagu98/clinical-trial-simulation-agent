[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-simulation-agent"
version = "0.1.0"
description = "Agentic AI workflow and Monte Carlo simulation engine for clinical trial design and protocol assumption extraction"
authors = [
    { name = "Gretta Y. Rozenberg", email = "167578972+gyagu98@users.noreply.github.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
trial-sim = "trial_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
